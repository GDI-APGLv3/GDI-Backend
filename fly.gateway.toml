app = "<your-gateway-app>"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.gateway"

[env]
  TZ = "America/Argentina/Buenos_Aires"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DB_PORT = "5432"
  DB_USER = "postgres"
  DB_NAME = "railway"
  AUTH0_DOMAIN = "<your-tenant>.auth0.com"
  AUTH0_AUDIENCE = "https://<your-tenant>.auth0.com/api/v2/"
  MCP_RESOURCE_URI = "https://<your-gateway-app>.fly.dev"
  TESTING_MODE = "false"
  CF_R2_SIGN_EXPIRATION = "600"
  PDFCOMPOSER_URL = "http://<your-pdfcomposer-app>.internal:8080"
  NOTARY_URL = "http://<your-notary-app>.internal:8080"
  EMAIL_SERVICE_URL = "http://<your-email-service>.internal:8080"
  AGENT_URL = "https://<your-agent-app>.fly.dev"
  FRONTEND_URL = "https://your-frontend.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
