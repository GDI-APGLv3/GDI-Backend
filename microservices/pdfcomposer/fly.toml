app = "<your-pdfcomposer-app>"
primary_region = "gru"

[build]

[env]
  TZ = "America/Argentina/Buenos_Aires"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  GUNICORN_WORKERS = "2"
  GUNICORN_TIMEOUT = "120"
  DEFAULT_TIMEOUT = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 4

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 4

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
