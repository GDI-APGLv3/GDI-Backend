<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DOCUMENTO - GDILatam.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include 'fonts.html' %}
  <style>
    /* Design System GDI - Tokens alineados con frontend shadcn/ui Neutral */
    :root {
      --foreground: rgba(10, 10, 10, 1.00);
      --foreground-muted: rgba(115, 115, 115, 1.00);
      --card: rgba(255, 255, 255, 1.00);
      --card-foreground: rgba(10, 10, 10, 1.00);
      --background-muted: rgba(245, 245, 245, 1.00);
      --border: rgba(229, 229, 229, 1.00);
      --border-strong: rgba(163, 163, 163, 1.00);
      --divider: rgba(212, 212, 212, 1.00);
      --primary: rgba(23, 23, 23, 1.00);
      --primary-foreground: rgba(250, 250, 250, 1.00);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-card: 10px;
      --elevation-sm: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
    }

    .corner-img {
      position: absolute;
      top: 25.5pt;
      right: 0;
      width: 50%;
      height: 85px;
      object-fit: contain;
      object-position: right center;
      border-radius: 0 0px 0 0;
      z-index: 0;
      pointer-events: none;
    }
    .header {
      position: relative;
      z-index: 1;
    }
    @page { size: A4; margin: 7mm 10mm 10mm 10mm; }
    body {
      margin: 0;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
      color: var(--foreground);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      line-height: 1.35;
      font-size: 11pt;
    }
    .page { }
    /* Cabecera */
    .doc-type {
      font-size: 13pt;
      font-weight: 700;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
      color: var(--foreground);
      letter-spacing: 0.02em;
      margin: 0;
    }
    .citydate, .docnum {
      font-size: 11pt;
      font-weight: 500;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
      margin: 0;
    }
    .docnum {
      margin-bottom: 24pt; /* duplica el espacio debajo del número de documento */
    }
    .ref {
      font-size: 11pt;
      font-weight: 400;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
      margin-top: 12pt; /* equivalente a 2 enters */
      margin-bottom: 0.3em; /* separación de 0.3 después de referencia */
    }
    .frase-anual {
      text-align: center;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
      font-weight: 300;
      font-size: 8pt;
      color: var(--foreground-muted);
      margin: 0;
      padding: 0;
      height: 12pt;
      line-height: 12pt;
      overflow: hidden;
    }
    .divider {
      border-top: 1.5px solid var(--divider);
      margin: 0; /* sin espacio */
      margin-bottom: 0.3em; /* separación de 0.3 después de la línea */
    }
    /* Contenido */
    .content {
      margin-top: 0.3em; /* 0.3 después de la línea */
      text-align: justify;
      font-size: 11pt;
      font-weight: 400;
      font-family: 'Montserrat', Tahoma, Arial, sans-serif;
    }
    /* Normalización para contenido HTML (Quill editor) */
    .content table { border-collapse: collapse; width: 100%; }
    .content table th, .content table td { border: 1px solid var(--border); padding: 6px 10px; }
    .content table th { background: var(--background-muted); font-weight: 600; }
    .content ul, .content ol { padding-left: 1.5em; margin: 0.5em 0; }
    .content h1, .content h2, .content h3, .content h4 { margin: 0.6em 0 0.3em; }
    /* GDI-068: alineacion de parrafos/imagenes del editor (Quill).
       Selector descendiente .content .ql-align-* (especificidad 0,2,0) le
       gana al text-align: justify de .content (0,1,0) sin depender de
       orden en cascada. */
    .content .ql-align-left { text-align: left; }
    .content .ql-align-center { text-align: center; }
    .content .ql-align-right { text-align: right; }
    .content .ql-align-justify { text-align: justify; }
    /* Tipografia del editor (Quill): tamano de texto, fuente y titulos.
       Mismo criterio que .ql-align-*: descendiente .content .ql-* para
       ganarle al .content base sin depender del orden de cascada. Los
       tamanos son em (relativos al font-size base de .content). */
    .content .ql-size-small { font-size: 0.75em; }
    .content .ql-size-large { font-size: 1.5em; }
    .content .ql-size-huge { font-size: 2.5em; }
    /* Serif/monospace via DejaVu (instaladas en el contenedor por el
       Dockerfile). El default (sin clase) queda en Montserrat. */
    .content .ql-font-serif { font-family: 'DejaVu Serif', Georgia, 'Times New Roman', serif; }
    .content .ql-font-monospace { font-family: 'DejaVu Sans Mono', 'Courier New', monospace; }
    /* Titulos h1/h2/h3 (Quill header): WeasyPrint aplica UA stylesheet, pero
       fijamos tamanos explicitos para que coincidan con el editor. */
    .content h1 { font-size: 2em; font-weight: 700; }
    .content h2 { font-size: 1.5em; font-weight: 700; }
    .content h3 { font-size: 1.17em; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page" style="position: relative;">
    {% if logo_data %}
    <img class="corner-img" src="{{logo_data}}" alt="Imagen esquina superior derecha">
    {% endif %}
    <section class="header">
      <p class="frase-anual">{% if frase_anual %}{{ frase_anual }}{% else %}&nbsp;{% endif %}</p>
      <br>
      <p class="doc-type">{{name_acrony_type}} - {{document_type}}</p>
      <p class="citydate" style="color: white;"> [ciudad y fecha a asignar]</p>
      <p class="docnum" style="color: white;"> [numero a asignar]</p>
      <br>
      <p class="ref">{{reference}}</p>
      <div class="divider"></div>
    </section>

    <main class="content">
{{text | safe}}

<div id="end-text" style="color: white;">end-text</div>

    </main>
  </div>
</body>
</html>
