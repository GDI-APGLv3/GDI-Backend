# =============================================================================
# ATENCION - ESTA ES UNA PLANTILLA DE DESARROLLO, NO DE PRODUCCION.
#
# Antes de desplegar un ambiente real cambia estas dos variables:
#
#   ENVIRONMENT = "prd"
#     Con cualquier otro valor la validacion HMAC entre servicios queda
#     DESACTIVADA (las requests pasan sin verificar X-Internal-Sign, solo se
#     loguea un warning). Con "prd" el arranque ABORTA si falta el secret
#     NOTARY_INTERNAL_HMAC_SECRET, que es el comportamiento correcto.
#
#   FALLBACK_TO_VISUAL = "false"
#     En "true", si falta el certificado el servicio emite una firma VISUAL
#     sin criptografia en lugar de fallar: el documento parece firmado y no
#     lo esta. En produccion debe ser "false".
#
# Secrets requeridos (nunca en este archivo):
#   flyctl secrets set NOTARY_INTERNAL_HMAC_SECRET=<valor> -a <tu-app>
#   flyctl secrets set API_KEY=<valor> -a <tu-app>
# =============================================================================

app = "<your-notary-app>"
primary_region = "gru"

[build]

[env]
  TZ = "America/Argentina/Buenos_Aires"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  ENVIRONMENT = "test"
  GUNICORN_WORKERS = "4"
  GUNICORN_TIMEOUT = "90"
  FALLBACK_TO_VISUAL = "true"
  TSA_URL = "http://timestamp.digicert.com"
  TSA_TIMEOUT = "3"
  TSA_RETRIES = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 4

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0

  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 4

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
