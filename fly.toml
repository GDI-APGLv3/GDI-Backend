app = "<your-backend-app>"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "development"
  TZ = "America/Argentina/Buenos_Aires"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"

  GUNICORN_WORKERS = "2"
  ASYNCPG_MIN_SIZE = "5"
  ASYNCPG_MAX_SIZE = "8"
  DB_PORT = "5432"
  DB_USER = "postgres"
  DB_NAME = "railway"
  AUTH0_DOMAIN = "<your-auth0-tenant>.us.auth0.com"
  AUTH0_AUDIENCE = "https://<your-auth0-tenant>.us.auth0.com/api/v2/"
  AUTH0_ISSUERS = "https://<your-auth0-tenant>.us.auth0.com/,https://auth-cliente.your-domain.com/"
  CF_R2_SIGN_EXPIRATION = "600"
  PDFCOMPOSER_URL = "http://<your-pdfcomposer-app>.flycast:8080"
  NOTARY_URL = "http://<your-notary-app>.flycast:8080"
  EMAIL_SERVICE_URL = "http://<your-email-service>.internal:8080"
  AGENT_URL = "https://<your-agent-app>.fly.dev"
  FRONTEND_URL = "https://your-frontend.vercel.app"
  RECONCILE_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  request_timeout = 120

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 10

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/livez"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
